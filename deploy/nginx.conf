# Load balancer in front of the app replicas.
# least_conn sends each request to the instance with the fewest active connections,
# which suits requests of uneven duration (checkout calls vs cached reads).
upstream venue_api {
    least_conn;
    server app1:4000 max_fails=3 fail_timeout=10s;
    server app2:4000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;

    gzip on;
    gzip_types application/json;

    location / {
        proxy_pass http://venue_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_next_upstream error timeout http_503;   # fail over to another instance (safe: only idempotent failures)
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }

    # Keep metrics off the public listener.
    location /metrics { return 404; }
}
