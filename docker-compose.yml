# Local / single-host production-like stack:  docker compose up --build
#   nginx (least_conn LB) -> app1, app2 -> postgres (+ optional replica), redis
name: venue-booker

x-app: &app
  build: .
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  environment: &app-env
    NODE_ENV: production
    TRUST_PROXY: "1"
    DB_HOST: postgres
    DB_NAME: venue_booker
    DB_USER: venue
    DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    DB_SYNC: "true"            # creates missing tables on first boot; idempotent
    REDIS_URL: redis://redis:6379
    JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    EMAIL_USER: ${EMAIL_USER:-}
    EMAIL_PASS: ${EMAIL_PASS:-}
  stop_grace_period: 30s

services:
  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: ["./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [app1, app2]
    restart: unless-stopped

  app1:
    <<: *app
  app2:
    <<: *app

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: venue_booker
      POSTGRES_USER: venue
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U venue -d venue_booker"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
