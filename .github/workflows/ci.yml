name: CI/CD

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  image:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }},ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Rolling deploy of the exact image built above. Needs a KUBE_CONFIG secret; remove this job if you deploy another way.
  deploy:
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production        # configure required reviewers on this environment for a manual approval gate
    steps:
      - uses: actions/checkout@v4
      - name: Roll out
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" > kubeconfig && export KUBECONFIG=$PWD/kubeconfig
          kubectl apply -f deploy/k8s/
          kubectl set image deployment/venue-booker api=ghcr.io/${{ github.repository }}:${{ github.sha }}
          kubectl rollout status deployment/venue-booker --timeout=180s || (kubectl rollout undo deployment/venue-booker && exit 1)
